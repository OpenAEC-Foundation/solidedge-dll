[workspace]
resolver = "2"
members = [
    "crates/sedge-core",
    "crates/sedge-read",
    "crates/sedge-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "LGPL-3.0-or-later"
publish = false

[workspace.dependencies]
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
sedge-core = { path = "crates/sedge-core" }
sedge-read = { path = "crates/sedge-read" }

[profile.release]
lto = "thin"
